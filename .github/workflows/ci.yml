name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 只测 Node 24+：
        #   - node:sqlite 在 22.x / 23.x 是实验特性，需 --experimental-sqlite flag
        #   - 从 24 起默认启用，"装完就能用"
        #   - vitest 5.x 也要求 ^22.12 || ^24 || >=26
        # 之前测 22.5 和 22.12 都失败了，原因见 CHANGELOG v0.1.8 / v0.1.9。
        node: ['24.x', '25.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show Node / npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm test

      - name: Run doctor (reproducible self-check)
        run: node dist/cli.js doctor

      - name: Verify package contents
        run: npm pack --dry-run

  consistency:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check that documented facts match the source
        run: node scripts/check-consistency.mjs
