name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22.12 是 vitest 5.x 的下限（它的 engines 写 ^22.12.0 || ^24 || >=26）。
        # 不测 22.5：node:sqlite 在 22.5 就有了，但测试框架跑不起来。
        node: ['22.12', '22.x', '24.x']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show Node / npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Build and test
        run: npm test

      - name: Run doctor (reproducible self-check)
        run: node dist/cli.js doctor

      - name: Verify package contents
        run: npm pack --dry-run

  consistency:
    name: Documentation consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Check that documented facts match the source
        run: node scripts/check-consistency.mjs
